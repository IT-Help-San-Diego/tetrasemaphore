<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The Tetrasemaphore — Four states of thinking: NORMATIVE (I), NON-NORMATIVE (σᵥ), METACOGNITIVE (σₕ), CRITICAL (C₂)">
  <title>The Tetrasemaphore — Four states of thinking</title>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#d4a853" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" fill="#d4a853" font-family="monospace" font-size="18">TETRASEMAPHORE.SYSTEMS · V₄ = {I, σᵥ, σₕ, C₂}</text>
  <text x="600" y="140" text-anchor="middle" fill="#e8e0d2" font-family="sans-serif" font-weight="bold" font-size="52">The Tetrasemaphore</text>
  <text x="600" y="185" text-anchor="middle" fill="#a8b2c1" font-family="sans-serif" font-size="24">Four states of thinking. Every mark survives the move it names.</text>
  <text x="600" y="515" text-anchor="middle" fill="#d4a853" font-family="monospace" font-size="18">NORMATIVE (I) · NON-NORMATIVE (σᵥ) · METACOGNITIVE (σₕ) · CRITICAL (C₂)</text>
  <text x="600" y="560" text-anchor="middle" fill="#919baa" font-family="sans-serif" font-size="18">Carry the four states with mathematical notation — checkable by body, paper, phone, or Lean 4.</text>
</svg>
